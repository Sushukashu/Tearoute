function drawBridge(x,y,w,sag){for(let X=x;X<x+w;X++){const s=Math.sin((X-x)/w*Math.PI)*sag;const yy=y+s;R(X,yy,md(X-x,6)===0?'#3A1E12':'#C9A36B');R(X,yy+1,'#9E7A45');R(X,yy+2,md(X-x,6)===0?'#3A1E12':'#6B3A24');const ry=y-12+s*0.6;R(X,ry,'#8A6A3E');if(md(X-x,8)===0)for(let j=ry;j<yy;j++)R(X,j,'#8A6A3E');}for(const px0 of[x-2,x+w])for(let Y=y-16;Y<GY;Y++)R(px0,Y,'#4A2718',2,1);}

function drawWalk(x,y,w,h){for(let X=x;X<x+w;X++){R(X,y,'#3A1E12');R(X,y+1,md(X,7)===0?'#6B3A24':'#D2B07A');R(X,y+2,md(X,7)===0?'#6B3A24':'#B08A55');R(X,y+3,'#6B3A24');}for(let X=x+4;X<x+w-2;X+=Math.max(26,Math.floor((w-8)/Math.max(1,Math.round((w-8)/30))))){for(let Y=y+4;Y<y+h;Y++){R(X,Y,'#6B3A24');R(X+1,Y,'#4A2718');}}R(x+2,y+4,'#6B3A24',2,h-4);R(x+w-4,y+4,'#6B3A24',2,h-4);for(let Y=y+12;Y<y+h-4;Y+=14)for(let X=x+4;X<x+w-4;X++)if(md(X-x+(Y-y),14)<1)R(X,Y,'#7A5A34');}

const pr=md(t*1.6,1)<0.12;const bx=46,bw=52,by=218+(pr?1:0);R(bx+1,221,'#3A1010',bw,20);R(bx,by,GOLD,bw,18);R(bx+1,by+1,'#C8302A',bw-2,16);R(bx+1,by+1,'#E86050',bw-2,2);R(bx+1,by+15,'#8E1F1B',bw-2,2);if(!pr)R(bx,by+18,'#6E1612',bw,2);
